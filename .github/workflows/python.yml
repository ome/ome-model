name: Python CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: false # done by maven ci job
          python-version: "3.13"
          version: ${{ env.UV_VERSION }}

      - name: Install and verify locked development environment
        run: uv sync --locked

      - name: Verify transform catalog
        run: >-
          uv run --no-sync xsd-fu generate-transform-catalog
          specification/src/main/resources/transforms
          --output specification/src/main/resources/transforms/ome-transforms.xml
          --check

      - name: Check formatting
        run: uv run --no-sync ruff format --check

      - name: Lint
        run: uv run --no-sync ruff check --no-fix --output-format=github

      - name: Type check
        run: uv run --no-sync ty check

  test:
    name: Test Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          cache-dependency-glob: uv.lock
          enable-cache: false # done by maven ci job
          python-version: "3.13"
          version: ${{ env.UV_VERSION }}
          save-cache: false

      - name: Install locked development environment
        run: uv sync --locked

      - name: Run tests with branch coverage
        run: uv run --no-sync pytest
