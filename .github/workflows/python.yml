name: Python linting

on:
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Sync Python environment
        run: uv sync --locked
      - name: Lint with Ruff
        run: uv run --locked ruff check --output-format=github
