[project]
name = "xsd-fu"
version = "0.0.0"
description = "OME XML Schema Java source generation tools"
readme = "xsd-fu/README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Genshi>=0.7.11,<0.8",
    "xmlschema>=4.3.2,<5",
]

[project.scripts]
xsd-fu = "xsd_fu.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "ty==0.0.66",
]

[tool.uv.build-backend]
module-root = "xsd-fu/src"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["xsd-fu/src"]
include = [
    "xsd-fu/src/**/*.py",
    "xsd-fu/tests/**/*.py",
]
fix = true

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
extend-select = [
    "W",     # pycodestyle (Warning)
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "ISC",   # flake8-implicit-str-concat
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi
    "PERF",  # Perflint
    "FURB",  # refurb
    "RUF",
]
[tool.ty.environment]
python-version = "3.13"
root = ["xsd-fu/src"]

[tool.ty.src]
include = ["xsd-fu/src/xsd_fu", "xsd-fu/tests"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=xsd_fu",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["xsd-fu/tests"]
filterwarnings = [
    "ignore:.*__init__ missing .*:DeprecationWarning:genshi\\.template\\.(astutil|eval)", # Genshi upstream depreciation notice, not relevant to our usage, only becomes relevant in Python 3.15
]
markers = [
    "unit: focused tests that do not cross component boundaries",
    "integration: multi-component integration tests",
    "benchmark: performance and scaling tests",
]
