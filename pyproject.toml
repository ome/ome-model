[project]
name = "ome-model-tooling"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "Genshi>=0.7.11,<0.8",
    "pytz>=2024.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
]

[tool.uv]
package = false
required-version = "==0.12.1"

[tool.ruff]
required-version = "==0.16.1"
target-version = "py312"
extend-include = [
    "xsd-fu/xsd-fu",
]
extend-exclude = [
    "xsd-fu/python/generateDS/**",
]

[tool.ruff.lint]
extend-select = [
    "W",     # pycodestyle (Warning)
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "ISC",   # flake8-implicit-str-concat
    "G",     # flake8-logging-format
    "PIE",   # flake8-pie
    "PYI",   # flake8-pyi
    "PERF",  # Perflint
    "FURB",  # refurb
    "RUF",
]
ignore = [
    "UP015",    # Unnecessary open mode parameters
    "UP031",    # Use format specifiers instead of percent format
    "B903",
    "B904",
    "C408",     # Unnecessary `list()`/`dict()` call (rewrite as a literal)
    "G002",     # Logging statement uses `%`
    "G010",     # Logging statement uses `warn` instead of `warning`
    "FURB154",  # Use of repeated consecutive `global`
    "RUF031",   # Avoid parentheses for tuples in subscripts
]
